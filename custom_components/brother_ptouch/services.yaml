print_text:
  fields:
    device_id: &device
      selector:
        device:
          integration: brother_ptouch
    text:
      required: true
      example: "Kitchen\nSpices"
      selector:
        text:
          multiline: true
    align:
      default: center
      selector:
        select:
          options: [left, center, right]
    font_size: &font_size
      selector:
        number:
          min: 6
          max: 200
          mode: box
    font: &font
      example: /config/fonts/MyFont.ttf
      selector:
        text:
    copies: &copies
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
    auto_cut: &auto_cut
      default: true
      selector:
        boolean:
    cut_each: &cut_each
      default: false
      selector:
        boolean:
    chain: &chain
      default: false
      selector:
        boolean:
    cut_mark: &cut_mark
      default: false
      selector:
        boolean:
    margin_mm: &margin
      default: 2
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: mm
          mode: box

print_qr:
  fields:
    device_id: *device
    data:
      required: true
      example: "https://home.example.com/box/42"
      selector:
        text:
    text:
      example: "Box 42"
      selector:
        text:
    font_size: *font_size
    font: *font
    copies: *copies
    auto_cut: *auto_cut
    cut_each: *cut_each
    chain: *chain
    cut_mark: *cut_mark
    margin_mm: *margin

print_image:
  fields:
    device_id: *device
    image_path:
      example: /config/www/logo.png
      selector:
        text:
    image_url:
      example: "http://homeassistant.local:8123/local/logo.png"
      selector:
        text:
    dither:
      default: true
      selector:
        boolean:
    copies: *copies
    auto_cut: *auto_cut
    cut_each: *cut_each
    chain: *chain
    cut_mark: *cut_mark
    margin_mm: *margin

print_template:
  fields:
    device_id: *device
    template:
      required: true
      example: "spice-jar"
      selector:
        text:
    variables:
      example: '{"name": "Paprika"}'
      selector:
        object:
    copies: *copies
    auto_cut: *auto_cut
    cut_each: *cut_each
    chain: *chain
    cut_mark: *cut_mark
    margin_mm: *margin
